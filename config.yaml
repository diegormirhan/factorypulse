project:
  random_seed: 42
  model_version: "0.1.0"
dataset:
  source_url: "https://archive.ics.uci.edu/static/public/601/ai4i+2020+predictive+maintenance+dataset.zip"
paths:
  raw_data: "data/raw/ai4i2020.csv"
  model_bundle: "artifacts/model_bundle.joblib"
  metrics: "artifacts/metrics.json"
  reference_profile: "artifacts/reference_profile.json"
  predictions_log: "artifacts/predictions.jsonl"
training:
  test_size: 0.15
  validation_size: 0.15
  calibration_folds: 5
  false_negative_cost: 25.0
  false_positive_cost: 1.0
  threshold_min: 0.02
  threshold_max: 0.80
  threshold_steps: 200
  permutation_repeats: 20
monitoring:
  psi_bins: 10
  minimum_batch_size: 100
  warning_threshold: 0.10
  critical_threshold: 0.25
api:
  host: "0.0.0.0"
  port: 8000
